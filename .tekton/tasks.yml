apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: lint
spec:
  steps:
    - name: lint
      image: node:18
      script: |
        #!/bin/sh
        npm install
        npm run lint
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: test
spec:
  steps:
    - name: test
      image: node:18
      script: |
        #!/bin/sh
        npm install
        npm test
